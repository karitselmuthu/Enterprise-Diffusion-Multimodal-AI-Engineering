[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-diffusion-multimodal-ai"
version = "0.1.0"
description = "Runnable diffusion and multimodal learning application"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.27", "python-multipart>=0.0.9"]
vision = ["Pillow>=10", "pypdf>=4"]
ocr = ["pytesseract>=0.3.10"]
local-vlm = ["transformers>=4.45", "torch>=2.3", "Pillow>=10"]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["src*", "api*", "cli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
